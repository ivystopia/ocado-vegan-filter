name: Release userscript

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify userscript version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          script="ocado-vegan-filter.user.js"
          grep -F "// @version     ${version}" "${script}"
          node --check "${script}"

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          asset="ocado-vegan-filter-${version}.user.js"
          cp ocado-vegan-filter.user.js "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"
          git for-each-ref "refs/tags/${version}" --format="%(contents)" | sed "/^-----BEGIN PGP SIGNATURE-----$/,\$d" > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Ocado Vegan Filter ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            ocado-vegan-filter-${{ github.ref_name }}.user.js
            ocado-vegan-filter-${{ github.ref_name }}.user.js.sha256
